name: coupon Terraform Drift Detection

on:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 UTC 0:00 (JST 9:00)
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_BASE: ANK-未割当-金融クーポン管理/技術検証/terraform-skeleton

jobs:
  drift-detect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [mut, lt, st, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets[format('AWS_ACCOUNT_COUPON_{0}', matrix.env)] }}:role/coupon-${{ matrix.env }}-cicd-plan-role
          aws-region: ap-northeast-1

      - name: Terraform Init
        run: terraform -chdir="${TF_BASE}/environments/${{ matrix.env }}" init

      - name: Terraform Plan (detect drift)
        id: plan
        run: |
          set +e
          terraform -chdir="${TF_BASE}/environments/${{ matrix.env }}" plan -detailed-exitcode -no-color
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0=no change, 2=drift, 1=error
          exit 0

      - name: Notify Slack on Drift
        if: steps.plan.outputs.exit_code == '2'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OPS }}
          SLACK_TITLE: 'coupon Terraform Drift Detected: ${{ matrix.env }}'
          SLACK_MESSAGE: 'Run ID: ${{ github.run_id }}. Please investigate.'
          SLACK_COLOR: warning
