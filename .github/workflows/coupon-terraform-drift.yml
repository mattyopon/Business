name: coupon Terraform Drift Detection

on:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 UTC 0:00 (JST 9:00)
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_BASE: ANK-未割当-金融クーポン管理/技術検証/terraform-skeleton

jobs:
  drift-detect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # environments/ 配下に実在するディレクトリのみ。mut/lt/st 追加時にここを拡張する。
        env: [prod]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets[format('AWS_ACCOUNT_COUPON_{0}', matrix.env)] }}:role/coupon-${{ matrix.env }}-cicd-plan-role
          aws-region: ap-northeast-1

      - name: Terraform Init
        run: terraform -chdir="${TF_BASE}/environments/${{ matrix.env }}" init

      # IAM Role 全てに付与する Permissions Boundary ARN を環境別 secret から TF_VAR として供給する。
      - name: Export TF_VAR (boundary ARN)
        run: |
          echo "TF_VAR_iam_role_permissions_boundary_arn=${{ secrets[format('IAM_PERMISSIONS_BOUNDARY_ARN_COUPON_{0}', matrix.env)] }}" >> "$GITHUB_ENV"

      # required な tfvars を環境別 multi-line secret COUPON_TFVARS_<ENV> からファイル化する。
      - name: Prepare terraform.tfvars from secret
        shell: bash
        run: |
          set -euo pipefail
          TFVARS_CONTENT="${{ secrets[format('COUPON_TFVARS_{0}', matrix.env)] }}"
          if [[ -z "$TFVARS_CONTENT" ]]; then
            echo "::error::secret COUPON_TFVARS_${{ matrix.env }} is empty. Drift detection cannot run."
            exit 1
          fi
          printf '%s\n' "$TFVARS_CONTENT" > "${TF_BASE}/environments/${{ matrix.env }}/terraform.tfvars"

      - name: Terraform Plan (detect drift)
        id: plan
        run: |
          set +e
          terraform -chdir="${TF_BASE}/environments/${{ matrix.env }}" plan -detailed-exitcode -no-color
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0=no change, 2=drift, 1=error
          # drift / no-change はステップを成功扱いで継続、後段で notify。
          # error は step を失敗させて job 全体を fail させる (silent pass を避ける)。
          if [[ "$EXIT_CODE" == "1" ]]; then
            exit 1
          fi
          exit 0

      - name: Notify Slack on Drift
        if: steps.plan.outputs.exit_code == '2'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OPS }}
          SLACK_TITLE: 'coupon Terraform Drift Detected: ${{ matrix.env }}'
          SLACK_MESSAGE: 'Run ID: ${{ github.run_id }}. Please investigate.'
          SLACK_COLOR: warning

      - name: Notify Slack on Plan Failure
        if: failure() && steps.plan.outcome == 'failure'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OPS }}
          SLACK_TITLE: 'coupon Terraform Drift Workflow ERROR: ${{ matrix.env }}'
          SLACK_MESSAGE: 'Run ID: ${{ github.run_id }}. terraform plan failed (auth / backend / provider / syntax). Drift detection is NOT functioning - investigate immediately.'
          SLACK_COLOR: danger
