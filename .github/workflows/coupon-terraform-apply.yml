name: coupon Terraform Apply

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Environment (environments/ 配下に実在するもののみ。mut/lt/st 追加時はここを拡張)'
        required: true
        type: choice
        options:
          - prod

permissions:
  id-token: write
  contents: read

env:
  TF_BASE: ANK-未割当-金融クーポン管理/技術検証/terraform-skeleton

jobs:
  check-change-calendar:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.cal.outputs.can_deploy }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets[format('AWS_ACCOUNT_COUPON_{0}', inputs.env)] }}:role/coupon-${{ inputs.env }}-cicd-apply-role
          aws-region: ap-northeast-1

      - name: Check Change Calendar (PROD only)
        id: cal
        run: |
          set -e
          if [[ "${{ inputs.env }}" == "prod" ]]; then
            STATE=$(aws ssm get-calendar-state \
              --calendar-names \
                "arn:aws:ssm:ap-northeast-1::document/coupon-prod-deploy-calendar" \
                "arn:aws:ssm:ap-northeast-1::document/coupon-freeze-yearend" \
                "arn:aws:ssm:ap-northeast-1::document/coupon-freeze-monthend" \
              --query 'State' --output text)
            echo "Calendar state: $STATE"
            if [[ "$STATE" != "OPEN" ]]; then
              echo "::error::Deploy not allowed. Calendar is CLOSED."
              echo "can_deploy=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi
          echo "can_deploy=true" >> $GITHUB_OUTPUT

  apply:
    runs-on: ubuntu-latest
    needs: check-change-calendar
    if: needs.check-change-calendar.outputs.can_deploy == 'true'
    environment:
      name: coupon-${{ inputs.env }}
      # GitHub Environment 設定で承認者を指定 (PROD は 2 名)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets[format('AWS_ACCOUNT_COUPON_{0}', inputs.env)] }}:role/coupon-${{ inputs.env }}-cicd-apply-role
          aws-region: ap-northeast-1

      - name: Terraform Init
        run: terraform -chdir="${TF_BASE}/environments/${{ inputs.env }}" init

      # IAM Role 全てに付与する Permissions Boundary ARN を環境別 secret から TF_VAR として供給する。
      - name: Export TF_VAR (boundary ARN)
        run: |
          echo "TF_VAR_iam_role_permissions_boundary_arn=${{ secrets[format('IAM_PERMISSIONS_BOUNDARY_ARN_COUPON_{0}', inputs.env)] }}" >> "$GITHUB_ENV"

      # required な tfvars を環境別 multi-line secret COUPON_TFVARS_<ENV> からファイル化する。
      - name: Prepare terraform.tfvars from secret
        shell: bash
        run: |
          set -euo pipefail
          TFVARS_CONTENT="${{ secrets[format('COUPON_TFVARS_{0}', inputs.env)] }}"
          if [[ -z "$TFVARS_CONTENT" ]]; then
            echo "::error::secret COUPON_TFVARS_${{ inputs.env }} is empty. Cannot apply without required variables. Set this secret with the HCL content of terraform.tfvars."
            exit 1
          fi
          printf '%s\n' "$TFVARS_CONTENT" > "${TF_BASE}/environments/${{ inputs.env }}/terraform.tfvars"

      - name: Terraform Plan
        run: |
          terraform -chdir="${TF_BASE}/environments/${{ inputs.env }}" plan \
            -out=tfplan \
            -input=false

      - name: Terraform Apply
        id: apply
        # GitHub Actions の bash デフォルトは -eo pipefail だが、レビュー指摘を受け
        # 明示的に pipefail を宣言して tee 経由のサイレント成功偽装を二重で防ぐ。
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_BASE}/environments/${{ inputs.env }}" apply \
            -input=false \
            tfplan 2>&1 | tee /tmp/apply.log

      - name: Save Apply Log to S3
        if: always()
        run: |
          aws s3 cp /tmp/apply.log \
            s3://coupon-${{ inputs.env }}-audit-logs/cicd-logs/$(date +%Y/%m/%d)/apply-${{ github.run_id }}.log

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_OPS }}
          SLACK_TITLE: 'coupon Terraform Apply ${{ inputs.env }} (${{ job.status }})'
          SLACK_MESSAGE: 'Run ID: ${{ github.run_id }}'
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
