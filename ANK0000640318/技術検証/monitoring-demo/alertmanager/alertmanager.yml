global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'pager'

receivers:
  - name: 'default'
    # ローカル検証用にログのみ。実プロジェクトでは Slack / PagerDuty / Email 等を実装すること。
    webhook_configs:
      - url: 'http://localhost:5001/'
        send_resolved: true

  - name: 'pager'
    webhook_configs:
      - url: 'http://localhost:5001/critical'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname']
