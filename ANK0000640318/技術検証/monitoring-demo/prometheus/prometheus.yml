global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: payment-monitoring-demo
    env: local

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # payment-api scrape: ./app と payment-api コンテナは雛形未同梱 (docker-compose.yml で
  # 該当サービスはコメントアウト)。スクレイプ先が存在しないため、本ターゲットも合わせて
  # コメントアウトする。実プロジェクトで payment-api 計装が完了した時点で
  # docker-compose の sample-app/payment-api と一緒にこのブロックを有効化すること。
  # alerts.yml の `PaymentApiDown` / 5xx ratio / latency ルールも同時に有効化する。
  # - job_name: payment-api
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ['payment-api:8080']
