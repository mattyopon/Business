name: CI-CD Demo (k8s-github-actions-demo)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_deploy:
        description: "Run the deploy job (requires self-hosted runner or kubeconfig pre-setup)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write # github/codeql-action/upload-sarif で Trivy SARIF を Security tab に上げるため必須

env:
  # GHCR は repository name component が lowercase 必須。
  # `github.repository_owner` は表示ケースを保持するため、大文字を含む owner では
  # `docker push` も `kubectl set image` も "invalid reference format" で失敗する。
  # IMAGE_NAME は build job 内の docker/metadata-action で lowercase 化したものを使う
  # (本変数はレジストリホスト + repository 名の base path のみ提供。完全な image_ref は build job の output から取る)。
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME_BASE: demo-app
  NODE_VERSION: '20'
  # 本デモのルートディレクトリ。案件 ID を含むパスを直に書くと「コピーして案件番号を書き換える」運用で CI が壊れるため、
  # 変数経由でしか参照しない。新案件へコピーする際は本変数のみ書き換えれば全 job が追従する。
  # 例: ANK0000642825/技術検証/k8s-github-actions-demo
  DEMO_ROOT: ANK-未割当/技術検証/k8s-github-actions-demo

jobs:
  lint:
    # 注: GitHub Actions 仕様で `defaults.run.working-directory` は expression 非対応
    # ("You cannot use contexts or expressions in this keyword" — workflow syntax docs)。
    # そのため defaults は使わず、各 `run` ステップに `working-directory: ${{ env.DEMO_ROOT }}/...`
    # を明示する。これにより案件 ID コピー時は `env.DEMO_ROOT` のみ書き換えれば良い。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # lockfile は雛形のため未同梱。実プロジェクトでは npm ci に切り替える。
      - run: npm install --omit=dev
        working-directory: ${{ env.DEMO_ROOT }}/app
      # 雛形のため test.js は最小サンプル。失敗を握り潰さず、exit code を厳格に返す。
      - run: npm test
        working-directory: ${{ env.DEMO_ROOT }}/app

  build:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    outputs:
      image_ref: ${{ steps.image_ref.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: image_ref
        # GHCR は repository name 部分が lowercase 必須。owner を tr で小文字化する。
        # 結果は `<registry>/<owner-lower>/<image>:<sha>` の完全 image reference。
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REF="${IMAGE_REGISTRY}/${OWNER_LOWER}/${IMAGE_NAME_BASE}:${{ github.sha }}"
          echo "value=${REF}" >> "$GITHUB_OUTPUT"
          echo "Using image reference: ${REF}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ env.DEMO_ROOT }}/app
          push: true
          tags: ${{ steps.image_ref.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GHCR private package を pull するため scan job 側でも GHCR ログイン必須
      # (build job の docker config は同 runner にしか残らないため別 runner では再ログインが要る)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Action は再現性確保のためタグ pin する (Codex 指摘 #5 への対応)
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ needs.build.outputs.image_ref }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # CRITICAL/HIGH 検出時は exit 1 を返してデプロイをブロック
          exit-code: '1'
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  # NOTE: 本ジョブは「自己ホストランナー (Minikube/kind 起動済み) 上」での実行を想定。
  #       GitHub-hosted runner (ubuntu-latest) 上では kubectl/cluster が存在せず必ず失敗するため、
  #       `runs-on` を self-hosted ラベルに切替えている。push トリガーでの自動実行はしない
  #       (workflow_dispatch + run_deploy=true 限定)。
  #
  #       実プロジェクトでは ArgoCD/Flux 経由の GitOps を採用し、本ステップを manifest repo
  #       (kustomize image bump → PR) 更新に置き換えることを強く推奨する。
  deploy:
    # 自己ホストランナーのラベル例: ["self-hosted", "kubernetes-demo"]
    # チームで用意した self-hosted runner にラベルを合わせて起動する。
    # 自己ホストランナーが無い CI 環境では runs-on の解決自体に失敗するため、
    # `runs-on: ubuntu-latest` への一時切替えは禁止 (kubectl cluster-info が確実に落ちる)。
    runs-on: [self-hosted, kubernetes-demo]
    needs: [build, scan]
    # 自己ホストランナーが用意できない CI 環境ではデフォルトで実行しない。
    # 明示実行: gh workflow run ci-cd.yml -f run_deploy=true
    if: github.event_name == 'workflow_dispatch' && inputs.run_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Apply manifests
        run: |
          # 前提: 自己ホストランナーまたは外部クラスタへの kubeconfig を本ジョブで設定済みであること。
          # 本ファイルにそのセットアップは含めない (チーム固有のクラスタアクセス方式に依存)。
          if ! command -v kubectl >/dev/null; then
            echo "::error::kubectl が見つからない。本ステップは自己ホストランナー or kubectl 事前セットアップ必須。" >&2
            exit 1
          fi
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "::error::kubectl cluster-info が失敗。kubeconfig がランナー上に設定されているか確認すること。" >&2
            exit 1
          fi
          kubectl apply -f "${DEMO_ROOT}/kubernetes/"
          # build job が lowercase 化した完全な image_ref を再利用 (大文字 owner でも壊れない)。
          kubectl set image deployment/demo-app demo-app="${{ needs.build.outputs.image_ref }}"
          kubectl rollout status deployment/demo-app --timeout=180s
