name: CI-CD Demo (k8s-github-actions-demo)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/demo-app
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ANK-未割当/技術検証/k8s-github-actions-demo/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # lockfile は雛形のため未同梱。実プロジェクトでは npm ci に切り替える。
      - run: npm install --omit=dev
      - run: npm test || echo "(雛形のためテスト未実装でも継続)"

  build:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: ANK-未割当/技術検証/k8s-github-actions-demo
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ANK-未割当/技術検証/k8s-github-actions-demo/app
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Apply manifests (Minikube/kind 想定 - GitOps 化推奨)
        run: |
          echo "本デモは雛形のため kubectl apply を直接実行する想定だが、"
          echo "実プロジェクトでは ArgoCD/Flux 経由の GitOps を採用すること。"
          echo "kubectl set image deployment/demo-app demo-app=${IMAGE_NAME}:${GITHUB_SHA}"
