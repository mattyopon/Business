name: CI-CD Demo (k8s-github-actions-demo)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/demo-app
  NODE_VERSION: '20'
  # 本デモのルートディレクトリ。案件 ID を含むパスを直に書くと「コピーして案件番号を書き換える」運用で CI が壊れるため、
  # 変数経由でしか参照しない。新案件へコピーする際は本変数のみ書き換えれば全 job が追従する。
  # 例: ANK0000642825/技術検証/k8s-github-actions-demo
  DEMO_ROOT: ANK-未割当/技術検証/k8s-github-actions-demo

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.DEMO_ROOT }}/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # lockfile は雛形のため未同梱。実プロジェクトでは npm ci に切り替える。
      - run: npm install --omit=dev
      # 雛形のため test.js は最小サンプル。失敗を握り潰さず、exit code を厳格に返す。
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.DEMO_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ env.DEMO_ROOT }}/app
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Action は再現性確保のためタグ pin する (Codex 指摘 #5 への対応)
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # CRITICAL/HIGH 検出時は exit 1 を返してデプロイをブロック
          exit-code: '1'
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Apply manifests (Minikube ローカル想定 - 本番は GitOps 推奨)
        run: |
          # 本デモは雛形のため、CI runner 上の Minikube に kubectl apply する想定。
          # 実プロジェクトでは ArgoCD/Flux 経由の GitOps を採用し、本ステップを manifest repo 更新に置き換えること。
          if command -v kubectl >/dev/null && kubectl cluster-info >/dev/null 2>&1; then
            kubectl apply -f "${DEMO_ROOT}/kubernetes/"
            kubectl set image deployment/demo-app demo-app=${IMAGE_NAME}:${{ github.sha }}
            kubectl rollout status deployment/demo-app --timeout=180s
          else
            echo "::warning::kubectl/cluster が利用不可。本ステップは雛形のため、Minikube/kind を CI runner にセットアップして再実行してください。"
            exit 1
          fi
